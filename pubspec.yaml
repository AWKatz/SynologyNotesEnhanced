name: synologynotesenhanceds_enhanced
description: Synology Notes Enhanced — DS NoteStation client for Android, iOS, Windows, macOS, and Linux.
publish_to: 'none'
version: 0.12.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  encrypt: ^5.0.3 # AES-256-CBC for client-side note decryption
  flutter_widget_from_html_core: ^0.17.0 # render NoteStation note HTML
  archive: ^3.6.1 # read/write .nsx (ZIP) export bundles
  file_picker: ^8.1.2 # open/save dialogs for .nsx import/export
  flutter_inappwebview: ^6.1.5 # rich-text note editor (contenteditable HTML page)
  html: ^0.15.4 # parse note content to check it's in the safe rich-editable subset
  flutter_staggered_grid_view: ^0.7.0 # masonry note-card grid
  package_info_plus: ^8.1.2 # reads version from pubspec.yaml at runtime for the About tile
  url_launcher: ^6.3.1 # opens the system mail app for "Get Support"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/icons/
    - assets/editor/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F3C"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 256
  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#2C76DD"
    theme_color: "#2C76DD"

# Native splash screen (Android/iOS/Web) shown while Flutter's first frame
# renders. Uses the same placeholder icon as the app icon, centered on a
# solid color sampled from its background gradient — the four splash_*.png
# mockups in assets/icons/ are fixed-aspect-ratio device renders (with the
# app name baked in) meant as presentation mockups, not raw material a
# splash-screen generator can stretch/crop across arbitrary screen sizes.
flutter_native_splash:
  color: "#0B1F3C"
  image: assets/icons/app_icon.png
  android_12:
    image: assets/icons/app_icon.png
    icon_background_color: "#0B1F3C"
    color: "#0B1F3C"
  web: true
