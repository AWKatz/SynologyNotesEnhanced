name: synologynotesenhanceds_enhanced
description: Synology Notes Enhanced — DS NoteStation client for Android, iOS, Windows, macOS, and Linux.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  intl: ^0.19.0
  http: ^1.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  encrypt: ^5.0.3 # AES-256-CBC for client-side note decryption
  flutter_widget_from_html_core: ^0.16.0 # render NoteStation note HTML
  archive: ^3.6.1 # read/write .nsx (ZIP) export bundles
  file_picker: ^8.1.2 # open/save dialogs for .nsx import/export
  flutter_inappwebview: ^6.1.5 # rich-text note editor (contenteditable HTML page)
  html: ^0.15.4 # parse note content to check it's in the safe rich-editable subset

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/editor/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#1B4F8A"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
  linux:
    generate: true
    image_path: "assets/icons/app_icon.png"
